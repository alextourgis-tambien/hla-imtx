<!-- Keep this synchronous block before the existing loader. -->
<style>
@media (prefers-reduced-motion: no-preference) {
  html.hla-intro-loading .hero__hla,
  html.hla-intro-loading .hero__text,
  html.hla-intro-loading .hero__line { visibility: hidden !important; }
}
</style>
<script>
(function () {
  if (!window.matchMedia('(prefers-reduced-motion: no-preference)').matches) return;
  document.documentElement.classList.add('hla-intro-loading');
  window.setTimeout(function () {
    document.documentElement.classList.remove('hla-intro-loading');
  }, 12000);
})();
</script>
