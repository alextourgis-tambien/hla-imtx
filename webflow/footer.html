<script>
(async function () {
  try {
    const url = 'https://raw.githubusercontent.com/alextourgis-tambien/hla-imtx/main/assets/site.js?v=0.2.0&refresh=' + Date.now();
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('JS HTTP ' + response.status);
    const blob = new Blob([await response.text()], { type: 'text/javascript' });
    const source = URL.createObjectURL(blob);
    const script = document.createElement('script');
    script.src = source;
    script.onload = script.onerror = function () { URL.revokeObjectURL(source); };
    document.body.appendChild(script);
  } catch (error) {
    console.error('[HLA] Chargement JS impossible', error);
  }
})();
</script>
